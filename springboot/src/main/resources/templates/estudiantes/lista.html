<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Estudiantes</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    
    <header th:replace="~{fragments/layout :: mainNavbar}"></header>
    <main>
        <h1 th:text="${titulo}">Gestión de Estudiantes</h1>

        <div th:replace="~{fragments/layout :: alert}"></div>
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>Nombre Completo</th>
                    <th>Correo Institucional</th>
                    <th>Cursos Matriculados</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:if="${#lists.isEmpty(estudiantes)}">
                    <td colspan="6">No hay estudiantes registrados actualmente.</td>
                </tr>

                <tr th:each="e, stat : ${estudiantes}">
                    <td th:text="${stat.count}">1</td>
                    <td th:text="${e.nombre + ' ' + e.apellido}">Nombre Estudiante</td>
                    <td th:text="${e.correoInstitucional}">correo@icesi.edu.co</td>
                    <td>
                        <ul th:if="${not #lists.isEmpty(e.estudianteCursos)}" style="list-style-type: disc; margin-left: 20px;">
                            <li th:each="ec : ${e.estudianteCursos}" th:text="${ec.curso != null ? ec.curso.nombre : 'Sin nombre'}">Curso</li>
                        </ul>
                        <span th:if="${#lists.isEmpty(e.estudianteCursos)}" style="color: #64748b; font-style: italic;">Sin cursos matriculados</span>
                    </td>
                    <td>
                        <span th:if="${e.active}">Activo</span>
                        <span th:unless="${e.active}">Inactivo</span>
                    </td>
                    <td>
                        <a th:href="@{/estudiantes/desactivar/{id}(id=${e.id})}" th:text="${e.active ? 'Desactivar' : 'Activar'}">Alternar</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </main>
</body>
</html>
