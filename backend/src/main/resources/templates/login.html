<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${titulo}">Formulario de Login</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

    <div class="login-card">
        <h2>Iniciar Sesión</h2>

        <div th:if="${param.error}" class="alert alert-error">
            Correo o contraseña incorrecta. Por favor intentar de nuevo.
        </div>

        <div th:if="${param.logout}" class="alert alert-info">
            Has cerrado sesion satisfactoriamente.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label for="username">Nombre de usuario (Correo Institucional):</label>
                <input type="text" id="username" name="username" placeholder="correo@icesi.edu.o" required autofocus/>
            </div>

            <div class="form-group">
                <label for="password">password:</label>
                <input type="text" id="password" name="password" required/>
            </div>

            <button type="submit" class="btn-submit">Ingresar al Sistema</button>
        </form>
    </div>
</body>
</html>
